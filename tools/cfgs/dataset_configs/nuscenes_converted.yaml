DATASET: 'KittiDataset'
DATA_PATH: '/OpenPCDet/datasets/nsc'

# The converted data uses nuScenes LIDAR_TOP coordinate conventions and (typically) a wider XY range than KITTI.
POINT_CLOUD_RANGE: [0, -51.2, -5.0, 51.2, 51.2, 3.0]

MAP_CLASS_TO_KITTI: {
    'car': 'Car',
    'pedestrian': 'Pedestrian',
    'bicycle': 'Cyclist',
}

DATA_SPLIT: {
    'train': train,
    'test': val
}

# These will be created by the KITTI info generation step.
INFO_PATH: {
    'train': [kitti_infos_train.pkl],
    'test': [kitti_infos_val.pkl],
}

GET_ITEM_LIST: ["points"]
FOV_POINTS_ONLY: False

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          USE_ROAD_PLANE: False
          DB_INFO_PATH:
              - kitti_dbinfos_train.pkl
          PREPARE: {
             # Converted labels use lowercase nuScenes detection names, e.g. car/pedestrian/bicycle.
             filter_by_min_points: ['car:5', 'pedestrian:5', 'bicycle:5'],
          }

          SAMPLE_GROUPS: ['car:2', 'pedestrian:2', 'bicycle:2']
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: True

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.3925, 0.3925]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]


POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}


DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.1, 0.1, 0.2]
      MAX_POINTS_PER_VOXEL: 100
      MAX_NUMBER_OF_VOXELS: {
        'train': 600000,
        'test': 60000
      }
